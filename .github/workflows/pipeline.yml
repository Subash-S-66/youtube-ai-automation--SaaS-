name: Build and Push Pipeline Image

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/pipeline-worker:${{ github.sha }} .
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/pipeline-worker:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/pipeline-worker:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/pipeline-worker:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/pipeline-worker:latest
