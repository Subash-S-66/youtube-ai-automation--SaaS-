name: Build and Deploy ClipForge Azure Job

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pipeline/src/**'
      - 'pipeline/Dockerfile'
      - 'pipeline/requirements.txt'
      - 'pipeline/scripts/deploy_azure_job.ps1'
      - 'pipeline/config/**'
      - 'pipeline/data/**'

permissions:
  contents: read

concurrency:
  group: deploy-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-azure-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Azure Deployment Secrets
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          AZURE_ENVIRONMENT_RESOURCE_ID: ${{ secrets.AZURE_ENVIRONMENT_RESOURCE_ID }}
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
          YOUTUBE_CLIENT_SECRET_JSON_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON_BASE64 }}
          YOUTUBE_TOKEN_JSON_BASE64: ${{ secrets.YOUTUBE_TOKEN_JSON_BASE64 }}
        run: |
          missing=()
          for key in AZURE_CREDENTIALS AZURE_RESOURCE_GROUP AZURE_ACR_NAME AZURE_ENVIRONMENT_RESOURCE_ID ENV_FILE_BASE64 YOUTUBE_CLIENT_SECRET_JSON_BASE64 YOUTUBE_TOKEN_JSON_BASE64; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required Azure deployment secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt

      - name: Install Python Dependencies
        run: python -m pip install -r pipeline/requirements-dev.txt

      - name: Run Pipeline Tests
        env:
          PYTHONPATH: pipeline/src
        run: python -m pytest -q tests

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Prepare Config Files
        shell: bash
        env:
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
          YOUTUBE_CLIENT_SECRET_JSON_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON_BASE64 }}
          YOUTUBE_TOKEN_JSON_BASE64: ${{ secrets.YOUTUBE_TOKEN_JSON_BASE64 }}
        run: |
          mkdir -p pipeline/config pipeline/data/output
          python - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          targets = [
              ("ENV_FILE_BASE64", "pipeline/config/.env"),
              ("YOUTUBE_CLIENT_SECRET_JSON_BASE64", "pipeline/config/client_secret.json"),
              ("YOUTUBE_TOKEN_JSON_BASE64", "pipeline/data/output/token.json"),
          ]

          for env_name, out_path in targets:
              raw = (os.getenv(env_name) or "").strip()
              if not raw:
                  print(f"Missing required secret: {env_name}", file=sys.stderr)
                  sys.exit(1)
              try:
                  decoded = base64.b64decode(raw, validate=True)
              except Exception:
                  print(f"Invalid base64 in secret: {env_name}", file=sys.stderr)
                  sys.exit(1)

              path = pathlib.Path(out_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(decoded)
          PY

      - name: Deploy Azure Container Apps Job
        shell: pwsh
        working-directory: ./pipeline
        env:
          AZURE_JOB_CPU: "1"
          AZURE_JOB_MEMORY: "2Gi"
          AZURE_JOB_PARALLELISM: "2"
          AZURE_JOB_REPLICA_COMPLETION_COUNT: "1"
          AZURE_JOB_REPLICA_RETRY_LIMIT: "0"
          AZURE_JOB_REPLICA_TIMEOUT: "3600"
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          AZURE_JOB_NAME: "clipforge"
          AZURE_ENVIRONMENT_RESOURCE_ID: ${{ secrets.AZURE_ENVIRONMENT_RESOURCE_ID }}
        run: |
          ./scripts/deploy_azure_job.ps1 `
            -ResourceGroup $env:AZURE_RESOURCE_GROUP `
            -RegistryName $env:AZURE_ACR_NAME `
            -JobName $env:AZURE_JOB_NAME `
            -EnvironmentResourceId $env:AZURE_ENVIRONMENT_RESOURCE_ID
