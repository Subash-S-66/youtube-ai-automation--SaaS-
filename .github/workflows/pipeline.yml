name: Build and Deploy Azure Job

on:
  push:
    branches:
      - main
    paths:
      - 'pipeline/src/**'
      - 'pipeline/Dockerfile'
      - 'pipeline/requirements.txt'
      - 'pipeline/scripts/deploy_azure_job.ps1'
      - 'pipeline/config/**'
      - 'pipeline/data/**'

jobs:
  deploy-azure-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Prepare Config Files
        shell: bash
        run: |
          mkdir -p pipeline/config pipeline/data/output
          echo "${{ secrets.ENV_FILE_BASE64 }}" | base64 -d > pipeline/config/.env
          echo "${{ secrets.YOUTUBE_CLIENT_SECRET_JSON_BASE64 }}" | base64 -d > pipeline/config/client_secret.json
          echo "${{ secrets.YOUTUBE_TOKEN_JSON_BASE64 }}" | base64 -d > pipeline/data/output/token.json

      - name: Deploy Azure Container Apps Job
        shell: pwsh
        working-directory: ./pipeline
        env:
          AZURE_JOB_CPU: "1"
          AZURE_JOB_MEMORY: "2Gi"
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          AZURE_JOB_NAME: ${{ secrets.AZURE_JOB_NAME }}
          AZURE_ENVIRONMENT_RESOURCE_ID: ${{ secrets.AZURE_ENVIRONMENT_RESOURCE_ID }}
        run: |
          ./scripts/deploy_azure_job.ps1 `
            -ResourceGroup $env:AZURE_RESOURCE_GROUP `
            -RegistryName $env:AZURE_ACR_NAME `
            -JobName $env:AZURE_JOB_NAME `
            -EnvironmentResourceId $env:AZURE_ENVIRONMENT_RESOURCE_ID
