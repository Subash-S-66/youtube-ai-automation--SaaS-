name: Build and Deploy ClipForge Azure Job

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pipeline/src/**'
      - 'pipeline/Dockerfile'
      - 'pipeline/requirements.txt'
      - 'pipeline/scripts/deploy_azure_job.ps1'
      - 'pipeline/config/**'
      - 'pipeline/data/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-azure-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Validate Azure Deployment Secrets
        id: validate_azure_inputs
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          AZURE_ENVIRONMENT_RESOURCE_ID: ${{ secrets.AZURE_ENVIRONMENT_RESOURCE_ID }}
          AZURE_JOB_NAME_VAR: ${{ vars.AZURE_JOB_NAME }}
          AZURE_JOB_NAME_SECRET: ${{ secrets.AZURE_JOB_NAME }}
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
          YOUTUBE_CLIENT_SECRET_JSON_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON_BASE64 }}
          YOUTUBE_TOKEN_JSON_BASE64: ${{ secrets.YOUTUBE_TOKEN_JSON_BASE64 }}
        run: |
          missing=()
          for key in AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_RESOURCE_GROUP AZURE_ACR_NAME AZURE_ENVIRONMENT_RESOURCE_ID ENV_FILE_BASE64 YOUTUBE_CLIENT_SECRET_JSON_BASE64 YOUTUBE_TOKEN_JSON_BASE64; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required Azure deployment secrets: ${missing[*]}" >&2
            exit 1
          fi

          is_valid_job_name() {
            local value="$1"
            [ ${#value} -ge 2 ] && [ ${#value} -le 32 ] && [[ "$value" != *"--"* ]] && [[ "$value" =~ ^[a-z][a-z0-9-]*[a-z0-9]$ ]]
          }

          job_name_var="${AZURE_JOB_NAME_VAR:-}"
          job_name_secret="${AZURE_JOB_NAME_SECRET:-}"
          job_name=""

          if [ -n "$job_name_var" ] && is_valid_job_name "$job_name_var"; then
            job_name="$job_name_var"
          elif [ -n "$job_name_secret" ] && is_valid_job_name "$job_name_secret"; then
            if [ -n "$job_name_var" ] && ! is_valid_job_name "$job_name_var"; then
              echo "vars.AZURE_JOB_NAME is invalid. Falling back to secrets.AZURE_JOB_NAME."
            fi
            job_name="$job_name_secret"
          else
            if [ -z "$job_name_var" ] && [ -z "$job_name_secret" ]; then
              echo "Missing required AZURE_JOB_NAME. Set either vars.AZURE_JOB_NAME or secrets.AZURE_JOB_NAME." >&2
            elif [ -n "$job_name_var" ] && ! is_valid_job_name "$job_name_var"; then
              echo "Invalid vars.AZURE_JOB_NAME. Expected 2-32 chars, lower-case alphanumeric or '-', start with a letter, end with alphanumeric, and no '--'." >&2
            elif [ -n "$job_name_secret" ] && ! is_valid_job_name "$job_name_secret"; then
              echo "Invalid secrets.AZURE_JOB_NAME. Expected 2-32 chars, lower-case alphanumeric or '-', start with a letter, end with alphanumeric, and no '--'." >&2
            else
              echo "Unable to resolve a valid AZURE_JOB_NAME from vars/secrets." >&2
            fi
            exit 1
          fi

          echo "azure_job_name=$job_name" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt

      - name: Install Python Dependencies
        run: python -m pip install -r pipeline/requirements-dev.txt

      - name: Run Pipeline Tests
        env:
          PYTHONPATH: pipeline/src
        run: python -m pytest -q tests

      - name: Azure CLI Login (Service Principal)
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Prepare Config Files
        shell: bash
        env:
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
          YOUTUBE_CLIENT_SECRET_JSON_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON_BASE64 }}
          YOUTUBE_TOKEN_JSON_BASE64: ${{ secrets.YOUTUBE_TOKEN_JSON_BASE64 }}
        run: |
          mkdir -p pipeline/config pipeline/data/output
          python - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          targets = [
              ("ENV_FILE_BASE64", "pipeline/config/.env"),
              ("YOUTUBE_CLIENT_SECRET_JSON_BASE64", "pipeline/config/client_secret.json"),
              ("YOUTUBE_TOKEN_JSON_BASE64", "pipeline/data/output/token.json"),
          ]

          for env_name, out_path in targets:
              raw = (os.getenv(env_name) or "").strip()
              if not raw:
                  print(f"Missing required secret: {env_name}", file=sys.stderr)
                  sys.exit(1)
              try:
                  decoded = base64.b64decode(raw, validate=True)
              except Exception:
                  print(f"Invalid base64 in secret: {env_name}", file=sys.stderr)
                  sys.exit(1)

              path = pathlib.Path(out_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(decoded)
          PY

      - name: Compute Pinned Image Tag
        id: image_tag
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          image_tag="$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}-${short_sha}"
          if [ "$image_tag" = "latest" ]; then
            echo "Refusing to deploy with latest image tag." >&2
            exit 1
          fi
          echo "value=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Deploy Azure Container Apps Job
        shell: pwsh
        working-directory: ./pipeline
        env:
          AZURE_JOB_CPU: ${{ vars.AZURE_JOB_CPU || '1' }}
          AZURE_JOB_MEMORY: ${{ vars.AZURE_JOB_MEMORY || '2Gi' }}
          AZURE_JOB_PARALLELISM: ${{ vars.AZURE_JOB_PARALLELISM || '2' }}
          AZURE_JOB_REPLICA_COMPLETION_COUNT: ${{ vars.AZURE_JOB_REPLICA_COMPLETION_COUNT || '1' }}
          AZURE_JOB_REPLICA_RETRY_LIMIT: ${{ vars.AZURE_JOB_REPLICA_RETRY_LIMIT || '0' }}
          AZURE_JOB_REPLICA_TIMEOUT: ${{ vars.AZURE_JOB_REPLICA_TIMEOUT || '3600' }}
          AZURE_JOB_ALLOW_CREATE: ${{ vars.AZURE_JOB_ALLOW_CREATE || 'false' }}
          AZURE_BUILD_PUSH_ONLY: ${{ vars.AZURE_BUILD_PUSH_ONLY || 'false' }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          AZURE_JOB_NAME: ${{ steps.validate_azure_inputs.outputs.azure_job_name }}
          AZURE_JOB_CONTAINER_NAME: ${{ vars.AZURE_JOB_CONTAINER_NAME || secrets.AZURE_JOB_CONTAINER_NAME || '' }}
          AZURE_ARM_API_VERSION: ${{ secrets.AZURE_ARM_API_VERSION || '2023-05-01' }}
          AZURE_IMAGE_TAG: ${{ steps.image_tag.outputs.value }}
          AZURE_ENVIRONMENT_RESOURCE_ID: ${{ secrets.AZURE_ENVIRONMENT_RESOURCE_ID }}
        run: |
          $allowCreate = [System.Convert]::ToBoolean($env:AZURE_JOB_ALLOW_CREATE)
          ./scripts/deploy_azure_job.ps1 `
            -ResourceGroup $env:AZURE_RESOURCE_GROUP `
            -RegistryName $env:AZURE_ACR_NAME `
            -JobName $env:AZURE_JOB_NAME `
            -ImageTag $env:AZURE_IMAGE_TAG `
            -EnvironmentResourceId $env:AZURE_ENVIRONMENT_RESOURCE_ID `
            -AllowCreate:$allowCreate
