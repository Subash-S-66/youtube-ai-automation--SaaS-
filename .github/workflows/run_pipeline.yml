name: Run Pipeline (GitHub Workspace)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: "Dispatch correlation id"
        required: true
      job_id:
        description: "Backend job id"
        required: true
      user_id:
        description: "User id"
        required: true
      run_mode:
        description: "Execution mode"
        required: false
      pipeline_payload:
        description: "Prepared pipeline payload JSON"
        required: false
      youtube_token_encrypted:
        description: "Encrypted YouTube token"
        required: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Prepare Config Files
        shell: bash
        env:
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
          YOUTUBE_CLIENT_SECRET_JSON_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON_BASE64 }}
          YOUTUBE_TOKEN_JSON_BASE64: ${{ secrets.YOUTUBE_TOKEN_JSON_BASE64 }}
        run: |
          mkdir -p pipeline/config pipeline/data/output
          python - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          targets = [
              ("ENV_FILE_BASE64", "pipeline/config/.env"),
              ("YOUTUBE_CLIENT_SECRET_JSON_BASE64", "pipeline/config/client_secret.json"),
              ("YOUTUBE_TOKEN_JSON_BASE64", "pipeline/data/output/token.json"),
          ]

          for env_name, out_path in targets:
              raw = (os.getenv(env_name) or "").strip()
              if not raw:
                  print(f"Missing required secret: {env_name}", file=sys.stderr)
                  sys.exit(1)
              try:
                  decoded = base64.b64decode(raw, validate=True)
              except Exception:
                  print(f"Invalid base64 in secret: {env_name}", file=sys.stderr)
                  sys.exit(1)

              path = pathlib.Path(out_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(decoded)
          PY

      - name: Parse Payload
        id: settings
        shell: bash
        env:
          INPUT_PIPELINE_PAYLOAD: ${{ inputs.pipeline_payload || '{}' }}
        run: |
          python - <<'PY'
          import json, os
          raw = os.getenv("INPUT_PIPELINE_PAYLOAD", "{}")
          try:
              payload = json.loads(raw)
          except Exception:
              payload = {}
          config = payload.get("videoConfig", {}) if isinstance(payload, dict) else {}
          count = config.get("videoCount") or 1
          try:
              count = int(count)
          except Exception:
              count = 1
          if count < 1:
              count = 1
          print(f"video_count={count}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
              fp.write(f"video_count={count}\n")
          PY

      - name: Validate Gemini Credentials
        shell: bash
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          GEMINI_FROM_ENV_FILE="$(grep -E '^GEMINI_API_KEY=' pipeline/config/.env 2>/dev/null | tail -n1 | cut -d= -f2- | tr -d '\r' || true)"
          GEMINI_EFFECTIVE_KEY="${GEMINI_FROM_ENV_FILE:-$GEMINI_API_KEY_SECRET}"
          if [ -z "${GEMINI_EFFECTIVE_KEY}" ]; then
            echo "GEMINI_API_KEY is missing. Set repository secret GEMINI_API_KEY or include GEMINI_API_KEY in ENV_FILE_BASE64."
            exit 1
          fi

      - name: Run Pipeline Runner
        env:
          PYTHONPATH: ${{ github.workspace }}/pipeline/src
          RUN_MODE: ${{ inputs.run_mode || 'prepared' }}
          RUN_COUNT: ${{ steps.settings.outputs.video_count }}
          PIPELINE_PAYLOAD: ${{ inputs.pipeline_payload || '{}' }}
          USER_ID: ${{ inputs.user_id || github.actor }}
          JOB_ID: ${{ inputs.job_id || github.run_id }}
          YOUTUBE_TOKEN_ENCRYPTED: ${{ inputs.youtube_token_encrypted || '' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          JULES_API_URL: ${{ secrets.JULES_API_URL }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python -m youtube_ai_automation.azure_job_runner
