name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Type Check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build Project
        working-directory: ./backend
        run: npm run build

      # Add hosting deployment step here (e.g. Render/Railway/Azure)
