name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Type Check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build Project
        working-directory: ./backend
        run: npm run build

      - name: Deploy to Render
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "Missing required secret: RENDER_DEPLOY_HOOK"
            exit 1
          fi

          case "${RENDER_DEPLOY_HOOK}" in
            http://*|https://*) ;;
            *)
              echo "RENDER_DEPLOY_HOOK must be a valid http(s) URL"
              exit 1
              ;;
          esac

          curl -fsSL -X POST "${RENDER_DEPLOY_HOOK}"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
