name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Security Audit
        working-directory: ./backend
        run: npm audit --omit=dev

      - name: Type Check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build Project
        working-directory: ./backend
        run: npm run build

      - name: Deploy to Render
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK is not set. Skipping Render deploy."
            exit 0
          fi

          case "${RENDER_DEPLOY_HOOK}" in
            http://*|https://*) ;;
            *)
              echo "RENDER_DEPLOY_HOOK must be a valid http(s) URL"
              exit 1
              ;;
          esac

          curl -fsSL -X POST "${RENDER_DEPLOY_HOOK}"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
