name: Deploy Backend (DigitalOcean)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Security Audit
        working-directory: ./backend
        run: npm audit --omit=dev

      - name: Type Check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build Project
        working-directory: ./backend
        run: npm run build

      - name: Validate DigitalOcean Secrets
        id: do_secrets
        run: |
          if [ -z "${DIGITALOCEAN_ACCESS_TOKEN}" ] || [ -z "${DIGITALOCEAN_APP_ID}" ]; then
            echo "Missing DigitalOcean secrets. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_APP_ID: ${{ secrets.DIGITALOCEAN_APP_ID }}

      - name: Setup doctl
        if: ${{ steps.do_secrets.outputs.ready == 'true' }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy to DigitalOcean App Platform
        if: ${{ steps.do_secrets.outputs.ready == 'true' }}
        run: doctl apps create-deployment "${DIGITALOCEAN_APP_ID}" --wait
        env:
          DIGITALOCEAN_APP_ID: ${{ secrets.DIGITALOCEAN_APP_ID }}
